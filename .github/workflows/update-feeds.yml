name: Update Feeds

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-feeds

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install just
        run: uv tool install rust-just==1.58.0

      - name: Run Tests
        working-directory: isc-feeds
        run: just test

      - name: Generate Feeds
        working-directory: isc-feeds
        run: just generate

      - name: Commit Changes
        run: |
          git add feeds/
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update feeds'
          # master may have moved since checkout; rebase so the push is a fast-forward
          git pull --rebase
          git push
