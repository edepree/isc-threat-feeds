[project]
name = "isc-threat-feeds"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.13.2",
    "ty>=0.0.1a25",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import formatting
    "N",            # naming
    "D",            # docstrings
    "ANN",          # type annotations
    "TID",          # no relative imports
    "G", "LOG",     # logging with %-patterns
    "BLE",          # no catch-all excepts
    "S",            # no assert for validation, plus security checks
    "DTZ",          # naive datetimes
    "PGH",          # specific type: ignore codes
    "PL",           # pylint rules implemented by ruff
    "UP",           # pyupgrade: modern Python 3.13 syntax
    "B",            # bugbear: likely bugs
    "SIM",          # simplifiable code
    "C4",           # comprehensions
    "PIE",          # unnecessary code
    "RET",          # return statements
    "RUF",          # ruff-specific rules
]
ignore = ["SIM108"]  # prefer if/else blocks over ternary assignments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # pytest relies on assert; test docstrings are optional in the Google style guide

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]
force-sort-within-sections = true
case-sensitive = false
order-by-type = false
known-first-party = ["isc_threat_feeds"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
